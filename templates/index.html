<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบตรวจจับรถบรรทุก - คลุมผ้าใบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>ตรวจจับรถบรรทุก &middot; การคลุมผ้าใบ</h1>
      <div class="topbar-meta">
        <span>กล้อง 01</span>
        <span class="sep">|</span>
        <span id="clock"></span>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="col-main">
      <div class="panel video-panel">
        <div class="video-wrap">
          <video id="video" src="{{ url_for('static', filename='video/trucks.mp4') }}" muted autoplay playsinline></video>
          <canvas id="overlay"></canvas>
        </div>
      </div>

      <div class="summary">
        <button type="button" class="summary-item" data-status="covered">
          <span class="summary-label"><i class="dot dot-covered"></i>คลุมผ้าใบ</span>
          <span class="summary-count" id="count-covered">0</span>
        </button>
        <button type="button" class="summary-item" data-status="uncovered">
          <span class="summary-label"><i class="dot dot-uncovered"></i>ไม่คลุมผ้าใบ</span>
          <span class="summary-count" id="count-uncovered">0</span>
        </button>
        <button type="button" class="summary-item" data-status="untidy">
          <span class="summary-label"><i class="dot dot-untidy"></i>คลุมไม่เรียบร้อย</span>
          <span class="summary-count" id="count-untidy">0</span>
        </button>
      </div>
      <p id="filter-hint" class="filter-hint"></p>
    </section>

    <aside class="panel log-panel">
      <div class="log-head">
        <h2>รายการที่ตรวจพบ</h2>
        <span class="log-total" id="log-total">0 คัน</span>
      </div>
      <div class="log-list" id="history-list">
        <p class="log-empty" id="history-placeholder">ยังไม่มีรถผ่าน</p>
      </div>
    </aside>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
